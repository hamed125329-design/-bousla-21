<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>البوصلة — شراء الكتاب</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>البوصلة</h1>

    <section class="product">
      <div class="cover">
        <!-- ضع صورة الغلاف هنا إن أردت -->
        <div class="cover-placeholder">غطاء الكتاب</div>
      </div>
      <div class="details">
        <h2>البوصلة</h2>
        <p class="description">كتاب إلكتروني يتناول مواضيع مهمة ويساعد القارئ على ... (أضف وصفك هنا).</p>
        <p class="price">السعر: <strong>75 SAR</strong></p>

        <form id="purchaseForm">
          <label for="buyerName">الاسم:</label>
          <input id="buyerName" name="buyerName" type="text" placeholder="أدخل اسمك" required />

          <label for="buyerEmail">الإيميل (اختياري):</label>
          <input id="buyerEmail" name="buyerEmail" type="email" placeholder="example@mail.com" />

          <button id="whatsappBtn" type="submit">اشترِ عبر WhatsApp</button>
        </form>

        <p class="note">ملاحظة: بعد استلام الدفعة يدويًا عبر WhatsApp سأرسل لك الكتاب مباشرة. لا توجد رسوم إضافية على الموقع.</p>
      </div>
    </section>

    <footer>
      <p>حقوق النشر © أنت — لا تشارك الملف عامّةً حفاظًا على حقوقك.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
